<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown Viewer</title>
  <link rel="stylesheet" href="/content/index.css" />
  <link rel="stylesheet" href="/content/themes.css" />
  <script src="/vendor/prism.min.js"></script>
  <script src="/vendor/prism-autoloader.min.js"></script>
</head>
<body>
  <script>
    // Bootstrap: load the active theme + syntax CSS and optional content
    // libraries. Mirrors background/inject.js + content/index.js's theme loading.
    ;(function () {
      var THEME_COLORS = {
        'github': 'light', 'github-dark': 'dark', 'almond': 'light', 'awsm': 'light',
        'axist': 'light', 'bamboo': 'auto', 'bullframe': 'light', 'holiday': 'auto',
        'kacit': 'light', 'latex': 'light', 'marx': 'light', 'mini': 'light',
        'modest': 'light', 'new': 'auto', 'no-class': 'auto', 'pico': 'auto',
        'retro': 'dark', 'sakura': 'light', 'sakura-vader': 'dark', 'semantic': 'light',
        'simple': 'auto', 'style-sans': 'light', 'style-serif': 'light', 'stylize': 'light',
        'superstylin': 'auto', 'tacit': 'light', 'vanilla': 'auto', 'water': 'light',
        'water-dark': 'dark', 'writ': 'light', 'custom': 'auto'
      }
      function css (href) {
        var l = document.createElement('link')
        l.rel = 'stylesheet'
        l.href = chrome.runtime.getURL(href)
        document.head.appendChild(l)
      }
      function js (src) {
        var s = document.createElement('script')
        s.src = chrome.runtime.getURL(src)
        document.body.appendChild(s)
      }
      chrome.storage.sync.get(null, function (settings) {
        settings = settings || {}
        var theme = settings.theme || 'github'
        var scheme = THEME_COLORS[theme] || 'auto'
        var dark = scheme === 'dark' || (scheme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.body.classList.add('_theme-' + theme, '_color-' + (dark ? 'dark' : 'light'))
        if (theme === 'custom') {
          var st = document.createElement('style')
          st.textContent = (settings.custom && settings.custom.theme) || ''
          document.head.appendChild(st)
        } else {
          css('/themes/' + theme + '.css')
        }
        if (settings.content && settings.content.syntax !== false) {
          css('/vendor/' + (dark ? 'prism-okaidia' : 'prism') + '.min.css')
        }
        if (settings.content && settings.content.emoji) js('/content/emoji.js')
        if (settings.content && settings.content.mermaid) {
          js('/vendor/mermaid.min.js')
          js('/vendor/panzoom.min.js')
        }
        if (settings.content && settings.content.mathjax) {
          js('/content/mathjax.js')
          js('/vendor/mathjax/tex-mml-chtml.js')
        }
      })
    })()
  </script>
  <script src="/content/dir-entry.js"></script>
</body>
</html>
